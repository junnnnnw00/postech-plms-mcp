name: tests-and-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade 'pip>=26.2.1' 'setuptools>=83.0.0'
          python -m pip install -e '.[dev]'
      - name: Check code
        run: ruff check src tests
      - name: Test without school credentials
        run: pytest -q
      - name: Build distribution
        run: python -m build
      - name: Audit installed dependencies
        run: pip-audit --progress-spinner off
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: python-distribution
          path: dist/*

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime container
        run: docker build --tag postech-plms-mcp:test .
      - name: Verify CLI
        run: docker run --rm postech-plms-mcp:test --help

  postgres-integration:
    # Test software only. No PLMS network calls, school secrets or production DB.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PLMS_TEST_POSTGRES: "1"
      PLMS_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2.1' 'setuptools>=83.0.0'
          python -m pip install -e '.[dev,postgres]'
      - name: Configure disposable test TLS
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -eu
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$RUNNER_TEMP/plms-pg-test.key" -out "$RUNNER_TEMP/plms-pg-test.crt" \
            >/dev/null 2>&1
          docker cp "$RUNNER_TEMP/plms-pg-test.crt" "$POSTGRES_CONTAINER:/var/lib/postgresql/server.crt"
          docker cp "$RUNNER_TEMP/plms-pg-test.key" "$POSTGRES_CONTAINER:/var/lib/postgresql/server.key"
          docker exec -u root "$POSTGRES_CONTAINER" chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
          docker exec -u root "$POSTGRES_CONTAINER" chmod 600 /var/lib/postgresql/server.key
          docker exec -u postgres "$POSTGRES_CONTAINER" psql -U postgres -c "ALTER SYSTEM SET ssl = 'on'"
          docker exec -u postgres "$POSTGRES_CONTAINER" psql -U postgres -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'"
          docker exec -u postgres "$POSTGRES_CONTAINER" psql -U postgres -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'"
          docker exec -u postgres "$POSTGRES_CONTAINER" psql -U postgres -c 'SELECT pg_reload_conf()'
          echo "PLMS_POSTGRES_SSLROOTCERT=$RUNNER_TEMP/plms-pg-test.crt" >> "$GITHUB_ENV"
      - name: Verify test TLS readiness
        run: |
          python - <<'PY'
          import os
          import time
          import psycopg
          for _ in range(20):
              try:
                  with psycopg.connect(os.environ['PLMS_TEST_DATABASE_URL'], sslmode='verify-full',
                                      sslrootcert=os.environ['PLMS_POSTGRES_SSLROOTCERT'], connect_timeout=2):
                      break
              except psycopg.Error:
                  time.sleep(1)
          else:
              raise SystemExit('Disposable PostgreSQL TLS did not become ready')
          PY
      - name: Test real PostgreSQL with synthetic data
        run: pytest -q tests/test_postgres_integration.py
      - name: Audit PostgreSQL dependency extra
        run: pip-audit --progress-spinner off
