[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "postech-plms-mcp"
version = "0.1.0"
description = "Personal, read-only POSTECH PLMS MCP for courses, deadlines, attendance and syllabus evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.30,<2", "httpx>=0.28,<1", "beautifulsoup4>=4.14,<5", "cryptography>=46", "pycryptodome>=3.23,<4", "pypdf>=6.1,<7", "olefile>=0.47", "uvicorn>=0.35", "python-multipart>=0.0.20"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "build>=1", "pip-audit>=2.9"]

[project.scripts]
plms-mcp = "plms_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plms_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
